[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sampath-chefshat-rl"
version = "1.0.0"
description = "Reproducible opponent-aware Double DQN experiments in the official Chef's Hat environment"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "torch>=2.2", "matplotlib>=3.8", "PyYAML>=6", "psutil>=5.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
